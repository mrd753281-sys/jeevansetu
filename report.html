<script>


// =====================================================
// JeevanSetu - REPORT SYSTEM
// =====================================================


// =====================================================
// SUPABASE CONFIGURATION
// =====================================================

const SUPABASE_URL =
    "https://ibhpzcpezurgqckeejqo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ahSzgt4tiAtD1sH1TOD-26g_3o8VnEMJ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


// =====================================================
// ELEMENTS
// =====================================================

const reportType =
    document.getElementById("reportType");

const locationInput =
    document.getElementById("locationInput");

const descInput =
    document.getElementById("descInput");

const photoInput =
    document.getElementById("photoInput");

const photoPreview =
    document.getElementById("photoPreview");

const latitudeInput =
    document.getElementById("latitude");

const longitudeInput =
    document.getElementById("longitude");

const coordinatesBox =
    document.getElementById("coordinates");

const locationStatus =
    document.getElementById("locationStatus");

const submitBtn =
    document.getElementById("submitBtn");

const refreshLocationBtn =
    document.getElementById("refreshLocationBtn");

const mapBtn =
    document.getElementById("mapBtn");

const statusBox =
    document.getElementById("status");

const reportsList =
    document.getElementById("reportsList");

const userStatus =
    document.getElementById("userStatus");


// =====================================================
// CURRENT USER
// =====================================================

let currentUser = null;


// =====================================================
// SHOW STATUS
// =====================================================

function showStatus(message, type = "info") {

    statusBox.textContent = message;

    statusBox.className =
        "status-message " + type;

}


// =====================================================
// LOCATION STATUS
// =====================================================

function showLocationStatus(
    message,
    type = "location-loading"
) {

    locationStatus.textContent =
        message;

    locationStatus.className =
        "location-status " + type;

}


// =====================================================
// CHECK LOGIN SESSION
// =====================================================

async function checkSession() {

    try {

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if (error) {

            throw error;

        }


        if (!data.session) {

            userStatus.textContent =
                "Login required";

            showStatus(
                "Please login to submit a report.",
                "error"
            );

            submitBtn.disabled = true;

            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1800);

            return;

        }


        currentUser =
            data.session.user;


        userStatus.textContent =
            "● Logged in";


        submitBtn.disabled = false;


        // Automatically get GPS
        getLocation();

    }

    catch (error) {

        console.error(
            "Session Error:",
            error
        );

        userStatus.textContent =
            "Session error";

        showStatus(
            "Unable to verify your login session.",
            "error"
        );

    }

}


// =====================================================
// GET GPS LOCATION
// =====================================================

// =====================================================
// GET GPS LOCATION - FIXED
// =====================================================

function getLocation() {

    if (!navigator.geolocation) {

        showLocationStatus(
            "❌ GPS is not supported by this browser.",
            "location-error"
        );

        return;
    }

    showLocationStatus(
        "📡 Getting GPS location... Please allow location access.",
        "location-loading"
    );

    locationInput.placeholder =
        "Getting GPS location...";

    refreshLocationBtn.disabled = true;


    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            // Save GPS coordinates
            latitudeInput.value = lat;
            longitudeInput.value = lon;


            // Show coordinates
            coordinatesBox.style.display = "block";

            coordinatesBox.textContent =
                "GPS: " +
                lat.toFixed(6) +
                ", " +
                lon.toFixed(6);


            // First show coordinates
            locationInput.value =
                lat.toFixed(6) +
                ", " +
                lon.toFixed(6);


            showLocationStatus(
                "📍 GPS found. Converting to address...",
                "location-loading"
            );


            // Convert GPS → Address
            await convertGPSIntoAddress(lat, lon);


            refreshLocationBtn.disabled = false;

        },


        function(error) {

            console.error(
                "GPS Error:",
                error
            );

            refreshLocationBtn.disabled = false;


            if (error.code === 1) {

                showLocationStatus(
                    "❌ Location permission denied. Please allow GPS access.",
                    "location-error"
                );

            }

            else if (error.code === 2) {

                showLocationStatus(
                    "❌ Location unavailable. Please try again.",
                    "location-error"
                );

            }

            else if (error.code === 3) {

                showLocationStatus(
                    "❌ GPS request timed out. Please try again.",
                    "location-error"
                );

            }

            else {

                showLocationStatus(
                    "❌ Unable to get GPS location.",
                    "location-error"
                );

            }


            locationInput.placeholder =
                "Enter location manually if GPS fails.";

        },


        {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0
        }

    );

}


// =====================================================
// GPS → ADDRESS
// OpenStreetMap Nominatim
// =====================================================

async function convertGPSIntoAddress(
    lat,
    lon
) {

    try {

        const url =
            "https://nominatim.openstreetmap.org/reverse" +
            "?format=jsonv2" +
            "&lat=" +
            encodeURIComponent(lat) +
            "&lon=" +
            encodeURIComponent(lon) +
            "&zoom=18" +
            "&addressdetails=1";


        const response =
            await fetch(url, {

                method: "GET",

                headers: {
                    "Accept":
                        "application/json"
                }

            });


        if (!response.ok) {

            throw new Error(
                "Address service unavailable"
            );

        }


        const data =
            await response.json();


        if (
            data &&
            data.display_name
        ) {

            locationInput.value =
                data.display_name;


            showLocationStatus(
                "✅ GPS location detected successfully.",
                "location-success"
            );

        }

        else {

            showLocationStatus(
                "✅ GPS found, but address could not be converted.",
                "location-error"
            );

        }

    }

    catch(error) {

        console.error(
            "GPS Address Conversion Error:",
            error
        );


        // IMPORTANT:
        // GPS coordinates remain available
        // even if address conversion fails.

        locationInput.value =
            lat.toFixed(6) +
            ", " +
            lon.toFixed(6);


        showLocationStatus(
            "✅ GPS found. Address conversion unavailable.",
            "location-error"
        );

    }

}
