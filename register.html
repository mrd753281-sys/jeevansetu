<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JeevanSetu | Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e53935;
            color: white;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            margin-top: 12px;
            color: #1d2939;
            font-size: 28px;
        }

        .subtitle {
            margin-top: 6px;
            color: #667085;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #344054;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #e53935;
            box-shadow: 0 0 0 3px rgba(229,57,53,0.10);
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #e53935;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            display: block;
            background: #ecfdf3;
            color: #027a48;
        }

        .error {
            display: block;
            background: #fef3f2;
            color: #b42318;
        }

        .link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #667085;
        }

        .link a {
            color: #e53935;
            font-weight: bold;
            text-decoration: none;
        }

        .home {
            text-align: center;
            margin-top: 15px;
        }

        .home a {
            color: #667085;
            font-size: 13px;
            text-decoration: none;
        }

        @media(max-width:480px) {
            .container {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <div class="logo-icon">✚</div>
        <h1>JeevanSetu</h1>
        <p class="subtitle">
            Create your emergency assistance account
        </p>
    </div>

    <form id="registerForm">

        <div class="form-group">
            <label for="fullName">Full Name</label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >
        </div>

        <div class="form-group">
            <label for="phone">Mobile Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter mobile number"
                autocomplete="tel"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                minlength="6"
                autocomplete="new-password"
                required
            >
        </div>

        <button type="submit" id="registerBtn">
            Create Account
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <div class="home">
        <a href="index.html">← Back to JeevanSetu</a>
    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ibhpzcpezurgqckeejqo.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_ahSzgt4tiAtdS1hTOD-26g_3o8VnEMJ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const form =
    document.getElementById("registerForm");

const button =
    document.getElementById("registerBtn");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;
}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullName =
        document.getElementById("fullName")
        .value
        .trim();

    const phone =
        document.getElementById("phone")
        .value
        .trim();

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;


    if (!fullName || !phone || !email) {

        showMessage(
            "Please fill all required fields.",
            "error"
        );

        return;
    }


    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;
    }


    if (password !== confirmPassword) {

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    button.disabled = true;
    button.textContent = "Creating Account...";


    try {

        /*
         * Create Auth User
         */

        const {
            data,
            error
        } =
        await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {
                    full_name: fullName,
                    phone: phone
                }

            }

        });


        if (error) {
            throw error;
        }


        if (!data.user) {

            throw new Error(
                "Account could not be created."
            );

        }


        /*
         * Save Profile
         */

        const {
            error: profileError
        } =
        await supabaseClient
            .from("profiles")
            .insert({

                id: data.user.id,

                full_name: fullName,

                phone: phone,

                email: email,

                role: "user"

            });


        if (profileError) {

            console.error(
                "Profile Error:",
                profileError
            );

            showMessage( "Confirmation email sent to your email ID. Please check your email and confirm your account.",
    "success"

            );

            return;
        }


        /*
         * Success
         */

        showMessage(
            "Account created successfully! Redirecting to login...",
            "success"
        );


        form.reset();


        setTimeout(function() {

            window.location.href =
                "login.html";

        }, 1500);


    } catch(error) {

        console.error(
            "Registration Error:",
            error
        );


        showMessage(
            error.message ||
            "Registration failed. Please try again.",
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent = "Create Account";

    }

});

</script>

</body>
</html>
